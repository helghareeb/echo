name: Release

# Build cross-platform desktop installers when a version tag is pushed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      # Installs every platform's ffmpeg/ffprobe, not just this runner's — see
      # pnpm.supportedArchitectures in the root package.json. Without it the
      # arm64 mac runner produced an Intel .dmg carrying arm64 binaries, and the
      # app died on launch for every Intel Mac user. apps/desktop/build/afterPack.cjs
      # then keeps only the binary each artifact can use.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Build desktop installers
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing secrets are read into SIGN_* and only promoted to the real
          # electron-builder vars when non-empty — so builds are signed if a
          # certificate is configured, and cleanly unsigned otherwise.
          SIGN_CSC_LINK: ${{ secrets.CSC_LINK }}
          SIGN_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          SIGN_APPLE_ID: ${{ secrets.APPLE_ID }}
          SIGN_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SIGN_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$SIGN_CSC_LINK" ]; then
            export CSC_LINK="$SIGN_CSC_LINK"
            export CSC_KEY_PASSWORD="$SIGN_CSC_KEY_PASSWORD"
          fi
          if [ -n "$SIGN_APPLE_ID" ]; then
            export APPLE_ID="$SIGN_APPLE_ID"
            export APPLE_APP_SPECIFIC_PASSWORD="$SIGN_APPLE_APP_SPECIFIC_PASSWORD"
            export APPLE_TEAM_ID="$SIGN_APPLE_TEAM_ID"
          fi
          pnpm --filter @sada/desktop dist

      # Fedora / openSUSE / RHEL friends. Deliberately a separate, non-fatal step:
      # the fpm build electron-builder bundles dates from 2016 and fails against
      # rpm >= 6, so an rpm that cannot be built must never cost everyone else
      # their .deb and .AppImage. If this step is skipped the release simply has
      # no .rpm, and docs/INSTALL.md points those users at the AppImage.
      - name: Build .rpm (best effort)
        if: runner.os == 'Linux'
        continue-on-error: true
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y rpm
          sudo rpmdb --initdb || true
          pnpm --filter @sada/desktop dist:linux:rpm

      - name: Verify the installers carry the right ffmpeg
        shell: bash
        run: node scripts/verify-artifacts.mjs

      - name: Attach installers to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.rpm
          fail_on_unmatched_files: false

      - name: Upload build artifacts (non-tag runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: sada-${{ matrix.os }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.rpm
          if-no-files-found: ignore

  # The release body is written HERE and nowhere else. It used to be attached by
  # the build step above, which runs on all three runners — so each one appended
  # another copy and v1.1.0 shipped with the download table repeated four times.
  # This job runs once, after every installer is uploaded, and replaces the body
  # rather than appending, so a re-run cannot duplicate it either.
  notes:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write the release notes
        uses: softprops/action-gh-release@v2
        with:
          # Bilingual "which file do I download, and what do I do with it"
          # instructions, kept in the repo so every release page carries them.
          # GitHub's generated changelog is appended after this.
          body_path: .github/RELEASE_BODY.md
          append_body: false
          generate_release_notes: true
